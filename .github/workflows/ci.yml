name: iOS build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: xenoci-macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: xcodebuild -scheme PaidIos -destination 'generic/platform=iOS Simulator' build | tail -20
